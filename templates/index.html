<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>All Video Downloader</title>
<style>
body{font-family:system-ui;margin:0;background:#10131a;color:#fff}.wrap{max-width:650px;margin:auto;padding:35px 18px}
.card{background:#191e28;border:1px solid #2d3442;border-radius:20px;padding:22px}
h1{margin-top:0}input,select,button{width:100%;box-sizing:border-box;padding:14px;border-radius:12px;border:1px solid #3a4353;margin:7px 0;background:#0f131a;color:#fff}
button{cursor:pointer;font-weight:700;background:#fff;color:#111;border:0}small{color:#aeb7c5}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
#msg{white-space:pre-wrap;margin-top:12px}
a{color:#8ec5ff}
</style></head>
<body><div class="wrap"><div class="card">
<h1>🎬 All Video Downloader</h1>
<p><small>নিজের বা অনুমতিপ্রাপ্ত ভিডিওর URL দিন। Downloader নিজে কোনো watermark যোগ করে না। Source-এর embedded watermark সরানো হয় না।</small></p>
<form id="f" method="post" action="/download">
<input name="url" type="url" placeholder="https://..." required>
<div class="row">
<select name="mode"><option value="video">🎥 MP4 Video</option><option value="audio">🎵 MP3 Audio</option></select>
<select name="quality"><option value="best">Best quality</option><option value="720">720p</option><option value="480">480p</option></select>
</div>
<button id="b">Download</button>
</form>
<div id="msg"></div>
</div></div>
<script>
const f=document.getElementById('f'),b=document.getElementById('b'),m=document.getElementById('msg');
f.addEventListener('submit',()=>{b.disabled=true;b.textContent='Downloading…';m.textContent='Download শুরু হয়েছে। বড় ভিডিওতে সময় লাগতে পারে।';});
</script></body></html>
